<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>팀전 스트로크 8421 · 4인</title><style>:root{--g:#08783e;--bg:#f3f6f4;--line:#dce5df;--r:#c73737;--b:#2563b8}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:14px system-ui;color:#17211b}main{max-width:1200px;margin:auto;padding:24px}nav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}nav a{padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:#fff;color:#294237;text-decoration:none}.active{background:var(--g)!important;color:#fff!important}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px;margin:16px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}label{display:block;font-weight:650}input{width:100%;padding:8px;border:1px solid #cbd7cf;border-radius:8px;margin-top:4px}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;min-width:850px}th,td{border-bottom:1px solid #e6ece8;padding:8px;text-align:center}th{background:#f7faf8}.red{color:var(--r)}.blue{color:var(--b)}.check{width:auto}.pos{color:#08783e}.neg{color:#c73737}.hint{color:#68756e}.summary{font-size:16px;font-weight:700}</style></head><body><main><nav><a href="index.html">전체 메뉴</a><a href="stroke-standard-settlement-4p.html">개인 일반</a><a href="stroke-8421-settlement-4p.html">개인 8421</a><a href="team-stroke-standard-settlement-4p.html">팀 일반</a><a class="active" href="team-stroke-8421-settlement-4p.html">팀 8421</a></nav><h1>팀전 · 스트로크 8421</h1><p class="hint"><b class="red">Red P1·P2</b> vs <b class="blue">Blue P3·P4</b> · 보너스 포인트 및 스코어 배판 미제공</p>
<section class="card"><h2>기본 설정</h2><div class="grid"><label>8421 점수차이당<input id="unit" type="number" value="100" step="100"></label><label>1인 최대 획득/손실<input id="cap" type="number" value="10000" step="1000"></label><label>배틀컵 초기값<input id="cup" type="number" value="600" step="100"></label><label>멀리건/배판 1회 비용<input id="cost" type="number" value="100" step="100"></label><label>최대 배수<input id="maxMul" type="number" value="6" min="1"></label></div></section>
<section class="card"><h2>플레이어별 8421 환산점수</h2><p class="hint">상위 스코어 등급은 바로 아래 등급보다 반드시 커야 합니다.</p><div class="scroll"><table><thead><tr><th>플레이어</th><th>콘도르</th><th>알바트로스</th><th>이글</th><th>버디</th><th>파</th><th>보기</th><th>더블+</th></tr></thead><tbody id="maps"></tbody></table></div></section>
<section class="card"><h2>플레이어별 사용</h2><div class="grid" id="uses"></div></section><section class="card"><h2>홀별 입력 및 정산</h2><div class="scroll"><table><thead><tr><th>홀</th><th>Par</th><th class="red">P1</th><th class="red">P2</th><th class="blue">P3</th><th class="blue">P4</th><th>배판 사용</th><th>배수</th><th>팀 환산점수 / 결과</th></tr></thead><tbody id="holes"></tbody></table></div></section><section class="card"><h2>라운드 최종 결과</h2><div id="result"></div></section><section class="card"><h2>배틀컵</h2><div id="cupOut"></div></section>
<script>const pars=[4,4,3,5,4,4,3,5,4,4,4,3,5,4,4,3,5,4],scores=pars.map(p=>[p-1,p,p,p]),point=pars.map(()=>[0,0,0,0]),maps=[0,1,2,3].map(()=>[30,20,12,8,4,2,1]);const $=x=>document.getElementById(x),n=x=>+$(x).value||0,team=p=>p<2?0:1,sign=v=>`<span class="${v>0?'pos':v<0?'neg':''}">${v>0?'+':''}${Math.round(v).toLocaleString()}P</span>`;function init(){$('maps').innerHTML=maps.map((r,p)=>`<tr><td>P${p+1}</td>${r.map((v,i)=>`<td><input class="map" data-p="${p}" data-i="${i}" type="number" value="${v}"></td>`).join('')}</tr>`).join('');$('uses').innerHTML=[0,1,2,3].map(p=>`<label>P${p+1} 포인트 멀리건 횟수<input class="mull" type="number" min="0" value="0"></label>`).join('');$('holes').innerHTML=pars.map((par,h)=>`<tr><td>${h+1}</td><td><input class="par" data-h="${h}" type="number" value="${par}"></td>${[0,1,2,3].map(p=>`<td><input class="score" data-h="${h}" data-p="${p}" type="number" value="${scores[h][p]}"></td>`).join('')}<td>${[0,1,2,3].map(p=>`P${p+1}<input class="check point" data-h="${h}" data-p="${p}" type="checkbox">`).join(' ')}</td><td class="mul"></td><td class="out"></td></tr>`).join('');document.querySelectorAll('input').forEach(x=>x.addEventListener('change',read));read()}
function read(e){let t=e?.target;if(t?.classList.contains('map')){let p=+t.dataset.p,i=+t.dataset.i,old=maps[p][i],v=+t.value,copy=maps[p].slice();copy[i]=v;if(copy.some((x,j)=>j<6&&x<=copy[j+1])){alert('상위 스코어 등급은 아래 등급보다 반드시 커야 합니다.');t.value=old}else maps[p][i]=v}if(t?.classList.contains('score'))scores[+t.dataset.h][+t.dataset.p]=+t.value;if(t?.classList.contains('par'))pars[+t.dataset.h]=+t.value;if(t?.classList.contains('point')){let h=+t.dataset.h,p=+t.dataset.p;if(t.checked&&point.reduce((a,r)=>a+r[p],0)>=2){t.checked=false;alert('포인트 배판은 플레이어별 최대 2회입니다.')}point[h][p]=t.checked?1:0}calc()}
function cv(p,s,par){let d=s-par,i=d<=-4?0:d===-3?1:d===-2?2:d===-1?3:d===0?4:d===1?5:6;return maps[p][i]}function capZero(a,c){if(!c)return a.slice();let o=a.map(v=>Math.max(-c,Math.min(c,v)));for(let k=0;k<20;k++){let s=o.reduce((x,y)=>x+y,0);if(Math.abs(s)<1)break;let ids=o.map((v,i)=>i).filter(i=>s>0?o[i]>-c:o[i]<c);if(!ids.length)break;ids.forEach(i=>o[i]-=s/ids.length)}return o}
function calc(){let round=[0,0,0,0],wins=[0,0],mul=1,max=n('maxMul');scores.forEach((r,h)=>{let vals=r.map((s,p)=>cv(p,s,pars[h])),rt=vals[0]+vals[1],bt=vals[2]+vals[3],used=point[h].reduce((a,b)=>a+b,0),ap=Math.min(max,mul+used),o='동타 · 다음 홀 +1배';if(rt!==bt){let w=rt>bt?0:1,d=Math.abs(rt-bt)*n('unit')*ap;wins[w]++;round=round.map((v,p)=>v+(team(p)===w?d:-d));o=`${w?'Blue':'Red'} 승 · 환산차 ${Math.abs(rt-bt)} · 각 ${sign(d)}`;mul=1}else mul=Math.min(max,mul+1);let tr=document.querySelectorAll('#holes tr')[h];tr.querySelector('.mul').textContent=`×${ap}`;tr.querySelector('.out').innerHTML=`R ${rt} / B ${bt}<br>${o}`});let capped=capZero(round,n('cap')),m=[...document.querySelectorAll('.mull')].map(x=>Math.max(0,+x.value||0)),uses=[0,1,2,3].map(p=>point.reduce((a,r)=>a+r[p],0)),fees=m.map((v,p)=>(v+uses[p])*n('cost')),after=capped.map((v,p)=>v-fees[p]),cup=n('cup')+fees.reduce((a,b)=>a+b,0),w=wins[0]===wins[1]?-1:wins[0]>wins[1]?0:1,share=w<0?0:cup/2,final=after.map((v,p)=>v+(team(p)===w?share:0));$('result').innerHTML=`<p class="summary">홀 승리 Red ${wins[0]} / Blue ${wins[1]}</p><div class="scroll"><table><tr><th>플레이어</th><th>상한 적용 전</th><th>상한 적용 후</th><th>멀리건/배판 차감</th><th>배틀컵 포함 최종</th></tr>${[0,1,2,3].map(p=>`<tr><td>P${p+1}</td><td>${sign(round[p])}</td><td>${sign(capped[p])}</td><td>${sign(-fees[p])}</td><td>${sign(final[p])}</td></tr>`).join('')}</table></div>`;$('cupOut').innerHTML=w<0?`배틀컵 ${cup.toLocaleString()}P 이월 · 라운드 동률`:`<p class="summary">${w?'Blue':'Red'} 팀 우승 · 배틀컵 ${cup.toLocaleString()}P, 팀원 각 ${share.toLocaleString()}P</p>`}init();</script></main></body></html>
